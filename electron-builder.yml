appId: com.flowerbuddy.app
productName: 花伴
copyright: Copyright © 2026 花伴

directories:
  buildResources: assets
  output: release

files:
  - out/**/*
  - package.json
  - assets/default-pet/**/*
  - assets/pet-presets/**/*
  - '!**/*.map'

asar: true
npmRebuild: false
electronDist: node_modules/electron/dist

publish:
  provider: github
  owner: ZaiHuaOvO
  repo: FlowerBuddy

win:
  icon: app-icon.ico
  # Keep an ASCII executable name; the visible product/shortcut names are 花伴.
  executableName: FlowerBuddy
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 花伴
  uninstallDisplayName: ${productName} ${version}
  installerIcon: app-icon.ico
  uninstallerIcon: app-icon.ico
  installerHeader: installer/header.bmp
  installerSidebar: installer/sidebar.bmp
  uninstallerSidebar: installer/sidebar.bmp
  installerLanguages:
    - zh_CN
  language: '2052'
  displayLanguageSelector: false
  include: installer.nsh
  deleteAppDataOnUninstall: false
  artifactName: FlowerBuddy-Setup-${version}-${arch}.${ext}

portable:
  artifactName: FlowerBuddy-Portable-${version}-${arch}.${ext}
  unpackDirName: 花伴

extraResources:
  - from: LICENSE
    to: LICENSE
  - from: ASSETS-LICENSE.md
    to: ASSETS-LICENSE.md
  - from: licenses/THIRD_PARTY_LICENSES.md
    to: licenses/THIRD_PARTY_LICENSES.md
  - from: assets/tray-icon.png
    to: assets/tray-icon.png
  - from: assets/app-icon.png
    to: assets/app-icon.png
