appId: com.flowerbuddy.app
productName: 花伴
copyright: Copyright © 2026 花伴

directories:
  buildResources: assets
  output: release

files:
  - out/**/*
  - package.json
  - assets/default-pet/**/*
  - '!**/*.map'

asar: true
npmRebuild: false
electronDist: node_modules/electron/dist

win:
  icon: app-icon.ico
  # Keep an ASCII executable name; the visible product/shortcut names are 花伴.
  executableName: FlowerBuddy
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 花伴
  uninstallDisplayName: ${productName} ${version}
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

portable:
  artifactName: ${productName}-Portable-${version}-${arch}.${ext}
  unpackDirName: 花伴

extraResources:
  - from: licenses/THIRD_PARTY_LICENSES.md
    to: licenses/THIRD_PARTY_LICENSES.md
  - from: assets/tray-icon.png
    to: assets/tray-icon.png
  - from: assets/app-icon.png
    to: assets/app-icon.png
