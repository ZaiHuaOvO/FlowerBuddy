name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and draft release
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate tag and version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PACKAGE_VERSION}. Run 'npm version <version>' before pushing the tag."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # electron's npm package does not ship the runtime binary, and npm ci does
      # not run install.js. electron-builder uses electronDist explicitly.
      - name: Ensure Electron binary
        run: node node_modules/electron/install.js

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build Windows packages
        run: npm run dist:win

      - name: Create checksums
        shell: bash
        run: |
          cd release
          sha256sum *.exe *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Release ${GITHUB_REF_NAME} is already published. Bump the version instead of reusing the tag."
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" \
              release/*.exe \
              release/*.zip \
              release/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "花伴 ${GITHUB_REF_NAME#v}" \
              --generate-notes \
              release/*.exe \
              release/*.zip \
              release/SHA256SUMS.txt
          fi
