name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and draft release
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate tag and version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PACKAGE_VERSION}. Run 'npm version <version>' before pushing the tag."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # electron's npm package does not ship the runtime binary, and npm ci does
      # not run install.js. electron-builder uses electronDist explicitly.
      - name: Ensure Electron binary
        run: node node_modules/electron/install.js

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build renderer and main
        run: npm run build

      - name: Generate licenses
        run: npm run licenses

      - name: Build NSIS and portable packages
        shell: pwsh
        run: |
          npx electron-builder --win --x64 --publish never 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\electron-builder.log"
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content "$env:RUNNER_TEMP\electron-builder.log" -Tail 40 | ForEach-Object { Write-Output "::error::$_" }
            exit $code
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          node scripts/make-portable-zip.mjs 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\portable-zip.log"
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content "$env:RUNNER_TEMP\portable-zip.log" -Tail 30 | ForEach-Object { Write-Output "::error::$_" }
            exit $code
          }

      - name: Create checksums
        shell: bash
        run: |
          cd release
          sha256sum *.exe *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Require update metadata
        shell: bash
        run: |
          test -f release/latest.yml
          ls release/*.blockmap >/dev/null
          echo "latest.yml and blockmap are present"

      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="docs/releases/${GITHUB_REF_NAME}.md"
          ASSETS=(
            release/*.exe
            release/*.zip
            release/latest.yml
            release/*.blockmap
            release/SHA256SUMS.txt
          )
          if [ -f "$NOTES_FILE" ]; then
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
            echo "Using release notes from ${NOTES_FILE}"
          else
            NOTES_ARGS=(--generate-notes)
            echo "::warning::Missing ${NOTES_FILE}; falling back to generated notes."
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Release ${GITHUB_REF_NAME} is already published. Bump the version instead of reusing the tag."
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
            if [ -f "$NOTES_FILE" ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE"
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "花伴 ${VERSION}" \
              "${NOTES_ARGS[@]}" \
              "${ASSETS[@]}"
          fi
